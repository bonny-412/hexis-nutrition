spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/hexis
    username: hexis
    password: hexis
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  error:
    include-message: always

resend:
  base-url: https://api.resend.com
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:no-reply@hexisnutrition.example}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480
  frontend-professionisti:
    url: ${FRONTEND_PROFESSIONISTI_URL:http://localhost:5173}
